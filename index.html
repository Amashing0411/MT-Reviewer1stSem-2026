      (function() {
        try {
          var saved = localStorage.getItem("mt_reviewer_theme_2026");
          if (saved === "dark") {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");

        } catch(e) {}
      })();
    </script>
